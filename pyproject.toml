[project]
name = "chitu-diffusion"
version = "0.1.0"
description = "Diffusers-native context-parallel diffusion inference runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.13.0",
    "diffusers==0.38.0",
    "einops==0.8.2",
    "fastapi",
    "ftfy==6.3.1",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.2.6",
    "packaging>=24",
    "pyyaml",
    "regex==2025.11.3",
    "safetensors==0.8.0",
    "scipy==1.17.1",
    "sentencepiece==0.2.1",
    "protobuf>=6.33.6",
    "tiktoken>=0.7.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm==4.67.1",
    "transformers[torch]==5.12.1",
    "typing-extensions",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
chitu = "chitu_diffusion.cli:main"

[tool.setuptools.packages.find]
include = ["chitu_diffusion*"]
exclude = ["backup*"]

[tool.pytest.ini_options]
testpaths = ["test"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
# Switch to your cuda version
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
sageattention = { git = "https://github.com/thu-ml/SageAttention.git" }
spas_sage_attn = { git = "https://github.com/thu-ml/SpargeAttn.git" }



[tool.uv.extra-build-dependencies]
sageattention = ["torch==2.10.0", "numpy==2.2.6", "ninja"]
spas_sage_attn = ["torch==2.10.0"]

[tool.uv.extra-build-variables]
sageattention  = { EXT_PARALLEL= "4", NVCC_APPEND_FLAGS="--threads 8", MAX_JOBS="32", "TORCH_CUDA_ARCH_LIST" = "9.0"}
spas_sage_attn = { EXT_PARALLEL= "4", NVCC_APPEND_FLAGS="--threads 8", MAX_JOBS="32", "TORCH_CUDA_ARCH_LIST" = "9.0"}



[tool.uv]
# config-settings = { editable_mode = "compat" }
# no-build-isolation-package = ["sageattention", "spas_sage_attn"]
# reinstall-package = ["spas_sage_attn"]
override-dependencies = ["transformers==5.12.1"]
# [dependency-groups]
# dev = [
#     "torch==2.9.1",
#     "flash_attn",
# ]
[project.optional-dependencies]
eval = [
    "lpips==0.1.4",
    "pytorch-fid==0.3.0",
    "scikit-image==0.25.2",
    "torch-fidelity==0.4.0",
    "torchmetrics==1.9.0",
    # hpsv3 imports trainer modules at package import time; these are needed
    # even for reward inference, although plotting/tensorboard are not used.
    "matplotlib",
    "tensorboard",
    "hpsv3==1.0.0",
]
varlen = [
    "flash-attn-4==4.0.0b25",
    "nvidia-cutlass-dsl[cu13]==4.6.0.dev0",
    "quack-kernels==0.5.3",
]
flashinfer = ["flashinfer-python", "ninja"]
sage = ["sageattention"]
sparge = ["spas_sage_attn"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
