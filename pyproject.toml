[project]
name = "chitu-diffusion"
version = "0.1.0"
description = "Diffusers-native context-parallel diffusion inference runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "diffusers==0.37.0",
    "einops==0.8.1",
    "fastapi",
    "ftfy==6.3.1",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.4.0",
    "pyyaml",
    "regex==2025.11.3",
    "safetensors==0.7.0",
    "scipy==1.16.3",
    "sentencepiece==0.2.1",
    "protobuf==7.34.0",
    "tiktoken>=0.7.0",
    "torch==2.9.1",
    "torchvision",
    "tqdm==4.67.1",
    "transformers[torch]>=4.49.0,<4.57.0",
    "typing-extensions",
    "uvicorn[standard]",
    "accelerate>=1.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
chitu = "chitu_diffusion.cli:main"

[tool.setuptools.packages.find]
include = ["chitu_diffusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: performance measurements excluded from routine correctness runs",
    "distributed: requires torchrun with multiple ranks",
    "gpu: requires CUDA devices",
]

[dependency-groups]
dev = [
    "build",
    "mkdocs",
    "mkdocs-material",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["refs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
# Switch to your cuda version
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
sageattention = { git = "https://github.com/thu-ml/SageAttention.git" }
spas_sage_attn = { git = "https://github.com/thu-ml/SpargeAttn.git" }
fast-ulysses = { git = "https://github.com/triple-mu/fast-ulysses.git", rev = "6e5dcb24dc44e781ac3091d1d9b3f9fef314fb87" }



[tool.uv.extra-build-dependencies]
flash_attn = ["torch==2.9.1"]
sageattention = ["torch==2.9.1", "numpy==2.4.0", "ninja"]
spas_sage_attn = ["torch==2.9.1"]
fast-ulysses = ["torch==2.9.1", "cmake", "ninja"]

[tool.uv.extra-build-variables]
flash_attn     = { FLASH_ATTENTION_FORCE_BUILD = "TRUE", MAX_JOBS="8", FLASH_ATTN_CUDA_ARCHS = "90" }
sageattention  = { EXT_PARALLEL= "4", NVCC_APPEND_FLAGS="--threads 8", MAX_JOBS="32", "TORCH_CUDA_ARCH_LIST" = "9.0"}
spas_sage_attn = { EXT_PARALLEL= "4", NVCC_APPEND_FLAGS="--threads 8", MAX_JOBS="32", "TORCH_CUDA_ARCH_LIST" = "9.0"}



[tool.uv]
# config-settings = { editable_mode = "compat" }
# no-build-isolation-package = ["sageattention", "spas_sage_attn"]
# reinstall-package = ["spas_sage_attn"]
override-dependencies = ["transformers>=4.49.0,<4.57.0"]
[project.optional-dependencies]
eval = [
    "lpips==0.1.4",
    "pytorch-fid==0.3.0",
    "scikit-image==0.25.2",
    "torch-fidelity==0.4.0",
    "torchmetrics==1.9.0",
    # hpsv3 imports trainer modules at package import time; these are needed
    # even for reward inference, although plotting/tensorboard are not used.
    "matplotlib",
    "tensorboard",
    "hpsv3==1.0.0",
]
flash = ["flash_attn"]
flash3 = ["kernels==0.11.7"]
flashinfer = ["flashinfer-python", "ninja"]
sage = ["sageattention"]
sparge = ["spas_sage_attn"]
fast-ulysses = ["fast-ulysses"]
qknorm = [
    "ninja>=1.13.0",
]
