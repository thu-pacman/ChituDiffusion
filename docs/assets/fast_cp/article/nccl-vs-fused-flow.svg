<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Ulysses 与 AGKV 的 NCCL 和融合通信流程对比</title>
  <desc id="desc">NCCL 路径需要额外的布局整理和中间缓冲区，Fast CP 将目标布局编码进跨 GPU 写入。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#0f172a;font:700 30px Inter,"Noto Sans SC",sans-serif}.sub{fill:#475569;font:400 18px Inter,"Noto Sans SC",sans-serif}.label{fill:#0f172a;font:600 20px Inter,"Noto Sans SC",sans-serif}.small{fill:#334155;font:400 16px Inter,"Noto Sans SC",sans-serif}.tiny{fill:#475569;font:400 14px Inter,"Noto Sans SC",sans-serif}.method{fill:#fff;font:700 24px Inter,"Noto Sans SC",sans-serif}.box{stroke-width:2;rx:12}.input{fill:#eef2ff;stroke:#818cf8}.move{fill:#fff7ed;stroke:#fb923c}.comm{fill:#eff6ff;stroke:#3b82f6}.ready{fill:#ecfdf5;stroke:#10b981}.attn{fill:#f5f3ff;stroke:#8b5cf6}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dashed{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="930"/>
  <text class="head" x="700" y="55" text-anchor="middle">NCCL collective 与 Fast CP 融合通信</text>
  <text class="sub" x="700" y="88" text-anchor="middle">橙色步骤是额外的布局整理和 HBM 搬运；融合路径让数据直接落到目标布局</text>

  <rect x="42" y="125" width="1316" height="350" rx="18" class="panel"/>
  <rect x="42" y="125" width="150" height="350" rx="18" fill="#2563eb"/><rect x="42" y="440" width="150" height="35" fill="#2563eb"/>
  <text class="method" x="117" y="280" text-anchor="middle">Ulysses</text><text class="method" x="117" y="314" text-anchor="middle">Q / K / V</text>
  <text class="label" x="415" y="160" text-anchor="middle">NCCL 路径</text>
  <rect x="220" y="185" width="145" height="62" class="box input"/><text class="small" x="292" y="211" text-anchor="middle">本地序列</text><text class="tiny" x="292" y="233" text-anchor="middle">[S/P, H, D]</text>
  <path class="arrow" d="M365 216 H395"/><rect x="395" y="178" width="180" height="76" class="box move"/><text class="small" x="485" y="207" text-anchor="middle">permute + contiguous</text><text class="tiny" x="485" y="232" text-anchor="middle">按 peer 打包 send buffer</text>
  <path class="arrow" d="M575 216 H605"/><rect x="605" y="185" width="165" height="62" class="box comm"/><text class="small" x="687" y="211" text-anchor="middle">NCCL all-to-all</text><text class="tiny" x="687" y="233" text-anchor="middle">rank-major recv</text>
  <path class="arrow" d="M770 216 H800"/><rect x="800" y="178" width="180" height="76" class="box move"/><text class="small" x="890" y="207" text-anchor="middle">permute + contiguous</text><text class="tiny" x="890" y="232" text-anchor="middle">整理为 attention 布局</text>
  <path class="arrow" d="M980 216 H1010"/><rect x="1010" y="185" width="150" height="62" class="box ready"/><text class="small" x="1085" y="211" text-anchor="middle">全序列 / 局部 head</text><text class="tiny" x="1085" y="233" text-anchor="middle">[S, H/P, D]</text>
  <path class="arrow" d="M1160 216 H1190"/><rect x="1190" y="185" width="135" height="62" class="box attn"/><text class="small" x="1257" y="223" text-anchor="middle">Attention</text>
  <line x1="210" y1="282" x2="1330" y2="282" class="dashed"/>
  <text class="label" x="415" y="319" text-anchor="middle">Fast CP 融合路径</text>
  <rect x="220" y="342" width="145" height="62" class="box input"/><text class="small" x="292" y="368" text-anchor="middle">本地序列</text><text class="tiny" x="292" y="390" text-anchor="middle">[S/P, H, D]</text>
  <path class="arrow" d="M365 373 H445"/><rect x="445" y="334" width="360" height="78" class="box comm"/><text class="small" x="625" y="364" text-anchor="middle">NVSHMEM SM 写入 / Copy Engine 2D copy</text><text class="tiny" x="625" y="389" text-anchor="middle">地址和 pitch 同时完成 head 切分与序列拼接</text>
  <path class="arrow" d="M805 373 H1010"/><rect x="1010" y="342" width="150" height="62" class="box ready"/><text class="small" x="1085" y="368" text-anchor="middle">目标布局直接就绪</text><text class="tiny" x="1085" y="390" text-anchor="middle">[S, H/P, D]</text>
  <path class="arrow" d="M1160 373 H1190"/><rect x="1190" y="342" width="135" height="62" class="box attn"/><text class="small" x="1257" y="380" text-anchor="middle">Attention</text>
  <text class="tiny" x="220" y="444">Attention 输出的反向 all-to-all 使用同样的直接落位方式恢复本地序列布局。</text>

  <rect x="42" y="505" width="1316" height="350" rx="18" class="panel"/>
  <rect x="42" y="505" width="150" height="350" rx="18" fill="#059669"/><rect x="42" y="820" width="150" height="35" fill="#059669"/>
  <text class="method" x="117" y="690" text-anchor="middle">AGKV</text>
  <text class="label" x="415" y="540" text-anchor="middle">NCCL 路径</text>
  <rect x="220" y="565" width="145" height="62" class="box input"/><text class="small" x="292" y="591" text-anchor="middle">本地 K / V</text><text class="tiny" x="292" y="613" text-anchor="middle">[S/P, H, D]</text>
  <path class="arrow" d="M365 596 H400"/><rect x="400" y="558" width="195" height="76" class="box comm"/><text class="small" x="497" y="587" text-anchor="middle">两次 NCCL all-gather</text><text class="tiny" x="497" y="612" text-anchor="middle">K、V 各自产生中间输出</text>
  <path class="arrow" d="M595 596 H625"/><rect x="625" y="558" width="190" height="76" class="box move"/><text class="small" x="720" y="587" text-anchor="middle">unflatten + permute</text><text class="tiny" x="720" y="612" text-anchor="middle">+ contiguous</text>
  <path class="arrow" d="M815 596 H1010"/><rect x="1010" y="565" width="150" height="62" class="box ready"/><text class="small" x="1085" y="591" text-anchor="middle">完整 K / V</text><text class="tiny" x="1085" y="613" text-anchor="middle">[S, H, D]</text>
  <path class="arrow" d="M1160 596 H1190"/><rect x="1190" y="565" width="135" height="62" class="box attn"/><text class="small" x="1257" y="603" text-anchor="middle">Attention</text>
  <line x1="210" y1="662" x2="1330" y2="662" class="dashed"/>
  <text class="label" x="415" y="699" text-anchor="middle">Fast CP 融合路径</text>
  <rect x="220" y="722" width="145" height="62" class="box input"/><text class="small" x="292" y="748" text-anchor="middle">本地 K / V</text><text class="tiny" x="292" y="770" text-anchor="middle">[S/P, H, D]</text>
  <path class="arrow" d="M365 753 H445"/><rect x="445" y="714" width="360" height="78" class="box comm"/><text class="small" x="625" y="744" text-anchor="middle">一次 launch：向各 peer 的最终 offset 直接写入</text><text class="tiny" x="625" y="769" text-anchor="middle">K/V 共用启动、调度与完成握手</text>
  <path class="arrow" d="M805 753 H1010"/><rect x="1010" y="722" width="150" height="62" class="box ready"/><text class="small" x="1085" y="748" text-anchor="middle">完整 K / V 就绪</text><text class="tiny" x="1085" y="770" text-anchor="middle">[S, H, D]</text>
  <path class="arrow" d="M1160 753 H1190"/><rect x="1190" y="722" width="135" height="62" class="box attn"/><text class="small" x="1257" y="760" text-anchor="middle">Attention</text>

  <rect x="250" y="880" width="20" height="20" class="box input"/><text class="small" x="282" y="897">输入分片</text>
  <rect x="420" y="880" width="20" height="20" class="box move"/><text class="small" x="452" y="897">额外布局整理 / HBM 搬运</text>
  <rect x="750" y="880" width="20" height="20" class="box comm"/><text class="small" x="782" y="897">跨 GPU 通信</text>
  <rect x="970" y="880" width="20" height="20" class="box ready"/><text class="small" x="1002" y="897">Attention 所需布局</text>
</svg>