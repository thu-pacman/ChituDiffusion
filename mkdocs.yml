site_name: ChituDiffusion
site_description: Diffusers-native diffusion inference with EPE, context parallelism, and FlexCache
site_url: https://thu-pacman.github.io/ChituDiffusion/
repo_name: thu-pacman/ChituDiffusion
repo_url: https://github.com/thu-pacman/ChituDiffusion
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
nav:
  - 项目概述: index.md
  - 核心功能:
      - Fast CP: features/fast-cp.md
      - VAEP: features/vae-parallel.md
      - EPE: features/epe.md
      - FlexCache: features/flexcache.md
      - Diffusers API: features/diffusers-api.md
  - 使用说明:
      - 安装: usage/installation.md
      - 运行: usage/running.md
      - FreeCache Preview: usage/freecache-v2.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
