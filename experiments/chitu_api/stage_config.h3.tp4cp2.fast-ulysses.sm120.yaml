name: minimax_h3_tp4cp2_fast_ulysses_sm120
process: chitu_minimax_h3
factory: minimax-h3
gpu: [0, 1, 2, 3, 4, 5, 6, 7]
terminal: true

parallelism:
  sp: 2
  tp: 4
  chitu_pool:
    policy: static_cp
    allowed_lane_widths: [1, 2]
    pulse_steps: 2
    switch_allowed_until_step: 20
    min_resize_gain_ms: 5000
    resize_hysteresis_ms: 1000
    balanced_k: true
    starvation_ms: 30000
    deadline_guard_ms: 3000
    max_inflight_requests: 1
    max_pending_requests: 8
    warmup_resolutions: [16]
    warmup_steps: 3
    online_calibration: true

factory_args:
  model_path: /dockerdata/MiniMax-H3/FL2VA/transformer
  text_encoder_path: /dockerdata/MiniMax-H3/FL2VA/text_encoder
  tokenizer_path: /dockerdata/MiniMax-H3/FL2VA/tokenizer
  processor_path: /dockerdata/MiniMax-H3/FL2VA/processor
  video_vae_path: /dockerdata/MiniMax-H3/FL2VA/video_vae
  audio_vae_path: /dockerdata/MiniMax-H3/FL2VA/audio_vae
  enable_native_media: true
  parallel_vae: true
  vae_parallel_degree: 8
  qwen_num_layers: 50
  ffmpeg_path: ffmpeg
  default_duration_s: 5.0
  default_fps: 24
  default_output_type: mp4
  warmup_media_profiles: []
  num_steps: 20
  default_width: 768
  default_height: 768
  latent_t: 4
  audio_t: 8
  audio_channels: 2
  text_length: 64
  attention_mode: ulysses
  ulysses_degree: 2
  attention_backend: fa4
  flow_shift: 12.0
  audio_flow_shift: 3.0

service:
  host: 0.0.0.0
  port: 18088
  advertise_host: 127.0.0.1

output_root: outputs/h3-fast-ulysses-tp4cp2/service
record_timeline: true
postprocess_workers: 1
