name: image_decode
process: chitu_image_decoder
factory: zimage
gpu: [0, 1, 2, 3]
terminal: true

parallelism:
  sp: 4
  chitu_pool:
    policy: slo_elastic
    allowed_lane_widths: [1, 2, 4]
    switch_allowed_until_step: 20
    phase_max_steps: 1
    max_inflight_requests: 64
    max_pending_requests: 256
    cost_model: rtx4090
    online_calibration: true

factory_args:
  model_path: /path/to/Z-Image
  num_steps: 20
  sample_solver: flowmatch_euler
  default_width: 1024
  default_height: 1024

service:
  host: 0.0.0.0
  port: 18080
  advertise_host: 127.0.0.1

output_root: outputs/chitu-api
