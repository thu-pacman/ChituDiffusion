name: image_decode
process: chitu_image_decoder
factory: zimage
gpu: [0, 1, 2, 3]
terminal: true

parallelism:
  sp: 4
  chitu_pool:
    policy: elastic
    allowed_lane_widths: [1, 2, 4]
    switch_allowed_until_step: 20
    pulse_steps: 5
    balanced_k: true
    starvation_ms: 30000
    default_deadline_ms: 30000
    deadline_guard_ms: 3000
    max_inflight_requests: 64
    max_pending_requests: 256
    warmup_resolutions: [512, 1024, 2048]
    warmup_steps: 5
    online_calibration: true

factory_args:
  model_path: /path/to/Z-Image
  num_steps: 20
  sample_solver: flowmatch_euler
  default_width: 1024
  default_height: 1024
  attention_mode: agkv

service:
  host: 0.0.0.0
  port: 18080
  advertise_host: 127.0.0.1

output_root: outputs/chitu-api
