name: minimax_h3_tp2cp4
process: chitu_minimax_h3
factory: minimax-h3
gpu: [0, 1, 2, 3, 4, 5, 6, 7]
terminal: true

parallelism:
  # Fair trace comparison mesh: EPE chooses CP1/2/4; static_cp is TP2 x CP4.
  sp: 4
  tp: 2
  chitu_pool:
    policy: elastic
    allowed_lane_widths: [1, 2, 4]
    pulse_steps: 2
    switch_allowed_until_step: 10
    min_resize_gain_ms: 5000
    resize_hysteresis_ms: 1000
    balanced_k: true
    starvation_ms: 30000
    deadline_guard_ms: 3000
    max_inflight_requests: 8
    max_pending_requests: 256
    warmup_resolutions: [128]
    warmup_steps: 3
    online_calibration: true

factory_args:
  model_path: /dockerdata/MiniMax-H3/FL2VA/transformer
  text_encoder_path: /dockerdata/MiniMax-H3/FL2VA/text_encoder
  tokenizer_path: /dockerdata/MiniMax-H3/FL2VA/tokenizer
  processor_path: /dockerdata/MiniMax-H3/FL2VA/processor
  video_vae_path: /dockerdata/MiniMax-H3/FL2VA/video_vae
  audio_vae_path: /dockerdata/MiniMax-H3/FL2VA/audio_vae
  enable_native_media: true
  qwen_num_layers: 50
  media_owner_tp_plane: 0
  ffmpeg_path: ffmpeg
  default_duration_s: 5.0
  default_fps: 24
  default_output_type: mp4
  # Multiple spatial/temporal lengths used by the trace replay cost model.
  # MP4 profiles include VAE, D2H, and CPU mux terminal measurements.
  warmup_media_profiles:
    - {duration_s: 2.0, fps: 24, height: 512, width: 768, output_type: mp4}
    - {duration_s: 5.0, fps: 24, height: 768, width: 768, output_type: mp4}
    - {duration_s: 8.0, fps: 24, height: 768, width: 1024, output_type: mp4}
  num_steps: 20
  default_width: 128
  default_height: 128
  latent_t: 4
  audio_t: 8
  audio_channels: 2
  text_length: 64
  attention_mode: usp
  ulysses_degree: 4
  attention_backend: auto
  flow_shift: 12.0
  audio_flow_shift: 3.0

service:
  host: 0.0.0.0
  port: 18084
  advertise_host: 127.0.0.1

output_root: outputs/chitu-api/minimax-h3-tp2cp4
record_timeline: true
postprocess_workers: 4
