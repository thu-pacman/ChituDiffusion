launch:
  tag: zimage-dp2
  num_nodes: 1
  gpus_per_node: 2
  python_script: test/test_z_image.py
  srun:
    partition: debug
    cpus_per_gpu: 24
    job_name: chitu-zimage-dp2

runtime:
  chitu_debug: true
  cuda_launch_blocking: false

model:
  name: Z-Image
  ckpt_dir: /home/chenyy/WORK/models/Z-Image

parallel:
  cfp: 1
  up: 1

infer:
  attn_type: flash_attn
  low_mem_level: 0

eval:
  eval_type: []
  reference_path: null

output:
  root_dir: outputs/test-smoke
  run_log: true
  memory: true
  timer: true
  log_ranks: [0]

# Naive data parallel: split one request's n_sample batch across 2 replicas.
# cli derives cp_size = total_gpus // cfp = 2; override it back to 1 and enable
# dp_size=2 so the layout is cfg=1 * cp=1 * dp=2 == world_size(2).
overrides:
  - infer.diffusion.cp_size=1
  - infer.dp_size=2
  - models.sampler.sample_steps=4
