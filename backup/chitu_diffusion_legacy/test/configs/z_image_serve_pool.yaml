launch:
  tag: zimage-serve-pool
  backend: local
  num_nodes: 1
  gpus_per_node: 4
  python_script: test/test_z_image_serve.py
  srun:
    partition: debug
    cpus_per_gpu: 24
    job_name: chitu-zimage-serve-pool

runtime:
  chitu_debug: false
  cuda_launch_blocking: false

model:
  name: Z-Image
  ckpt_dir: /dockerdata/Z-Image

parallel:
  cfp: 1
  up: 1

infer:
  attn_type: flash_attn
  low_mem_level: 0

eval:
  eval_type: []
  reference_path: null

output:
  root_dir: outputs/serve-pool
  run_log: true
  memory: true
  timer: true
  log_ranks: [0]

# slo_elastic concurrent heterogeneous-lane pool engine on 4x RTX 4090.
# cli derives cp_size = total_gpus // cfp = 4, so the launch is cfg=1 * cp=4 * dp=1
# (== world_size 4). The engine partitions the 4 GPUs into lanes of width {1,2,4}
# each round, runs a distinct request per lane (request-level DP), and switches
# per-request SP width at denoise-step boundaries under the slo_elastic policy.
# Drive an arrival-timed client trace via CHITU_SERVE_TRACE.
overrides:
  - infer.diffusion.scheduling_policy=slo_elastic
  - infer.diffusion.dynamic_sp=true
  - infer.diffusion.cost_model=rtx4090
  - infer.diffusion.horizon_events=6
  - infer.diffusion.epe.enable_flexcache=false
  - models.sampler.sample_steps=20
