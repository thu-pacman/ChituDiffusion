launch:
  tag: pure_sp
  backend: local
  num_nodes: 1
  gpus_per_node: 4
  python_script: test/test_z_image_serve.py
  srun:
    partition: debug
    cpus_per_gpu: 24
    job_name: chitu-bench-pure-sp

runtime:
  chitu_debug: false
  cuda_launch_blocking: false

model:
  name: Z-Image
  ckpt_dir: /dockerdata/Z-Image

parallel:
  cfp: 1
  up: 1

infer:
  attn_type: flash_attn
  low_mem_level: 0

eval:
  eval_type: []
  reference_path: null

output:
  root_dir: outputs/bench_3way_50step
  run_log: true
  memory: true
  timer: true
  log_ranks: [0]

# 3-way serve benchmark (arm 3 of 3): pure sequence-parallel (Ulysses) baseline on
# 4x RTX 4090. Reuses the SAME pool engine as slo_elastic, but the layout is fixed to a
# single lane spanning all 4 GPUs at SP=4, so requests are served strictly one-at-a-time
# at maximum SP. Fastest per-request latency when idle; no concurrency under burst.
overrides:
  - infer.diffusion.scheduling_policy=pure_sp
  - infer.diffusion.dynamic_sp=true
  - models.sampler.sample_steps=50
