launch:
  tag: zimage-cb
  num_nodes: 1
  gpus_per_node: 1
  python_script: test/test_z_image.py
  srun:
    partition: debug
    cpus_per_gpu: 24
    job_name: chitu-zimage-cb

runtime:
  chitu_debug: true
  cuda_launch_blocking: false

model:
  name: Z-Image
  ckpt_dir: /home/chenyy/WORK/models/Z-Image

parallel:
  cfp: 1
  up: 1

infer:
  attn_type: flash_attn
  low_mem_level: 0

eval:
  eval_type: []
  reference_path: null

output:
  root_dir: outputs/test-cb
  run_log: true
  memory: true
  timer: true
  log_ranks: [0]

# Single-GPU Z-Image continuous batching (M3). Drive N same-shape requests via
# CHITU_Z_IMAGE_N_REQUESTS; the scheduler groups them and the generator runs one
# batched transformer forward per denoise step. cfg=1 * cp=1 * dp=1.
overrides:
  - models.sampler.sample_steps=4
  - infer.diffusion.continuous_batch=true
  - infer.diffusion.max_batch_items=8
