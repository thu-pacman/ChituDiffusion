launch:
  tag: pure_dp
  backend: local
  num_nodes: 1
  gpus_per_node: 4
  python_script: test/test_z_image_serve.py
  srun:
    partition: debug
    cpus_per_gpu: 24
    job_name: chitu-bench-pure-dp

runtime:
  chitu_debug: false
  cuda_launch_blocking: false

model:
  name: Z-Image
  ckpt_dir: /dockerdata/Z-Image

parallel:
  cfp: 1
  up: 1

infer:
  attn_type: flash_attn
  low_mem_level: 0

eval:
  eval_type: []
  reference_path: null

output:
  root_dir: outputs/bench_3way_50step
  run_log: true
  memory: true
  timer: true
  log_ranks: [0]

# 3-way serve benchmark (arm 2 of 3): pure request-level DP baseline on 4x RTX 4090.
# Reuses the SAME pool engine as slo_elastic, but the layout is fixed: every lane is
# width 1 (a single-GPU DP replica), so up to 4 distinct requests run concurrently,
# one per GPU, at SP=1. No SP acceleration; maximizes concurrency/throughput.
overrides:
  - infer.diffusion.scheduling_policy=pure_dp
  - infer.diffusion.dynamic_sp=true
  - models.sampler.sample_steps=50
