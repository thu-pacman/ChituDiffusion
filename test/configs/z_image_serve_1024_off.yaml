launch:
  tag: zimage-serve
  num_nodes: 1
  gpus_per_node: 1
  python_script: test/test_z_image_serve.py
  srun:
    partition: debug
    cpus_per_gpu: 24
    job_name: chitu-zimage-serve

runtime:
  chitu_debug: true
  cuda_launch_blocking: false

model:
  name: Z-Image
  ckpt_dir: /home/chenyy/WORK/models/Z-Image

parallel:
  cfp: 1
  up: 1

infer:
  attn_type: flash_attn
  low_mem_level: 0

eval:
  eval_type: []
  reference_path: null

output:
  root_dir: outputs/serve_1024_off
  run_log: true
  memory: true
  timer: true
  log_ranks: [0]

# Single-GPU serving replayer (cfg=1 * cp=1 * dp=1). Drives an arrival-timed
# Poisson client trace given by CHITU_SERVE_TRACE. To A/B the M3 continuous
# batching engine, add `-` overrides at launch, e.g.:
#   infer.diffusion.continuous_batch=true
# (baseline runs with the flag absent/false).
overrides:
  - models.sampler.sample_steps=20
